name: Refresh catalog

on:
  schedule:
    - cron: '7,37 * * * *'   # every 30 minutes
    - cron: '0 12 * * 1'     # weekly keep-alive (stops GitHub pausing the schedule)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: sudo apt-get install -y -qq fonts-dejavu-core >/dev/null
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .poster-cache
          key: posters-${{ github.run_id }}
          restore-keys: posters-
      - run: node scripts/build-static.js
        env:
          LOG_SOURCES: '1'
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify live add-on
        run: |
          sleep 20
          URL="${{ steps.deploy.outputs.page_url }}"
          curl -fsS -D - "${URL}manifest.json" -o /dev/null | grep -iE "^HTTP|access-control-allow-origin"
          curl -fsS "${URL}catalog/movie/qc-movie-4k.json" -o live.json
          node -e "const m=require('./live.json').metas;console.log('LIVE 4K Movies:',m.length);console.log('LIVE first:',m[0].name,'|',m[0].poster);console.log('LIVE desc:',JSON.stringify(m[0].description).slice(0,300))"
          curl -fsS "${URL}catalog/movie/qc-movie-4k/genre=2026%20%C2%B7%20Top%20rated.json" -o combo.json
          node -e "const m=require('./combo.json').metas;console.log('LIVE 2026 Top rated:',m.length);m.slice(0,6).forEach(x=>console.log('  ',x.name,x.releaseInfo,x.imdbRating,'|',x.description.split('\\n')[0]))"
          P=$(node -e "console.log(require('./live.json').metas[0].poster)"); curl -fsS -o /dev/null -w "poster HTTP %{http_code} %{content_type} %{size_download}B\n" "$P"
      - name: Save poster preview
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/prev && cp $(ls dist/posters/*.jpg | head -6) /tmp/prev/
          cd /tmp/prev && git init -q -b previews && git add . && git -c user.name=bot -c user.email=bot@x commit -qm preview
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" previews
      - name: Keep-alive commit
        if: github.event.schedule == '0 12 * * 1'
        run: |
          date -u > .last-keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add .last-keepalive
          git commit -m "keep-alive [skip ci]" || true
          git push
