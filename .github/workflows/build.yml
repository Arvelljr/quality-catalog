name: Refresh catalog

on:
  schedule:
    - cron: '7,37 * * * *'   # every 30 minutes
    - cron: '0 12 * * 1'     # weekly keep-alive (stops GitHub pausing the schedule)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/build-static.js
        env:
          LOG_SOURCES: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Keep-alive commit
        if: github.event.schedule == '0 12 * * 1'
        run: |
          date -u > .last-keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add .last-keepalive
          git commit -m "keep-alive [skip ci]" || true
          git push
